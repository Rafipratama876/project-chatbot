services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      # Read from .env, which the app reads too — one source of truth. Two
      # copies of the database name drift, and the drift is invisible:
      # POSTGRES_DB only applies when the data directory is FIRST created, so
      # editing it later is silently ignored and the app fails with
      # "database does not exist" against a Postgres that is up and healthy.
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-channel_letters}
    ports: ['${DB_PORT:-5433}:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-channel_letters}']
      interval: 5s
      retries: 10

  redis:
    image: redis:8.4.0-alpine3.22
    ports: ['${REDIS_PORT:-6380}:6379']

volumes:
  pgdata:
